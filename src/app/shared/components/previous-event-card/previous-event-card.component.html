@if (event().relativeUrl) {
  <a
    [routerLink]="event().relativeUrl"
    class="flex-1 min-w-[240px] max-w-[300px] rounded-lg block cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#07012a] focus:ring-[#fac738] transition-transform hover:scale-[1.02]"
  >
    <ng-container *ngTemplateOutlet="cardContent" />
  </a>
} @else {
  <a
    [href]="event().absoluteUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="flex-1 min-w-[240px] max-w-[300px] rounded-lg block cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#07012a] focus:ring-[#fac738] transition-transform hover:scale-[1.02]"
  >
    <ng-container *ngTemplateOutlet="cardContent" />
  </a>
}

<ng-template #cardContent>
  <div class="flex flex-col gap-4 pb-3">
    <!-- Image with badges -->
    <div class="relative h-[169px] rounded-xl overflow-hidden">
      <img
        [src]="event().image"
        [alt]="event().title"
        [title]="event().title"
        loading="lazy"
        class="w-full h-full object-cover"
      />
      <div class="absolute top-2.5 right-2.5 flex flex-col gap-2 items-end">
        <div
          class="bg-[#07012a] h-[32px] rounded-[16px] px-3 flex items-center gap-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 text-[#e5e8eb]"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
            />
          </svg>
          <span
            class="font-medium text-sm leading-[21px] text-[#e5e8eb] whitespace-nowrap"
            >{{ event().location }}</span
          >
        </div>
        <div
          class="bg-[#07012a] h-[32px] rounded-[16px] px-3 flex items-center gap-1"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 text-[#e5e8eb]"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"
            />
          </svg>
          <span
            class="font-medium text-sm leading-[21px] text-[#e5e8eb] whitespace-nowrap"
            >{{ event().date | date:'d/MMM/yy - h:mm a' }}</span
          >
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col">
      <h3 class="font-medium text-base leading-[24px] text-white mb-1">
        {{ event().title }}
      </h3>
      <p class="font-normal text-sm leading-[21px] text-[#ccbd8f]">
        {{ event().description }}
      </p>
    </div>
  </div>
</ng-template>
