<footer class="w-full bg-dark py-10 flex flex-col items-center gap-6 text-[#EAE0C8]">
  <!-- Navigation Links -->
  <div class="flex flex-wrap justify-center gap-8 md:gap-16 text-sm md:text-base font-medium">
    <a routerLink="/code-of-conduct" class="hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-[#fac738] rounded-sm">Código de Conducta</a>
  </div>

  <!-- Social Icons -->
  <div class="flex gap-6">
    <a href="https://youtube.com/@backboneutp6202" target="_blank" aria-label="YouTube" class="hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-[#fac738] rounded-sm">
      <app-icon iconName="youtube" [properties]="{ id: '', class: 'w-6 h-6' }"></app-icon>
    </a>
    <a href="https://github.com/Backbone-UTP" target="_blank" aria-label="GitHub" class="hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-[#fac738] rounded-sm">
      <app-icon iconName="github" [properties]="{ id: '', class: 'w-6 h-6' }"></app-icon>
    </a>
    <a href="https://linkedin.com/company/backboneutp" target="_blank" aria-label="LinkedIn" class="hover:text-white transition-colors focus:outline-none focus:ring-2 focus:ring-[#fac738] rounded-sm">
      <app-icon iconName="linkedin" [properties]="{ id: '', class: 'w-6 h-6' }"></app-icon>
    </a>
  </div>

  <!-- Copyright/Copyleft -->
  <div class="flex items-center gap-1 text-sm opacity-80">
    <app-icon iconName="copyleft" [properties]="{ id: '', class: 'w-4 h-4' }"></app-icon>
    <span>{{ currentYear }} - Backbone UTP</span>
  </div>
</footer>
