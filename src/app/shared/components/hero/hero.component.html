<div class="flex items-center w-full max-w-[960px] mx-auto p-4">
  <!-- Left content section -->
  <div class="flex-1 min-w-0 p-4">
    <div class="flex flex-col gap-[15px] justify-center min-h-[480px]">
      <h1
        class="font-black text-[48px] leading-[60px] tracking-[-2px] text-white"
      >
        {{ title }}
      </h1>
      <p class="font-normal text-base leading-[24px] text-white">
        {{ subTitle }}
      </p>
      <a
        [href]="communityUrl"
        target="_blank"
        rel="noopener noreferrer"
        class="bg-[#fac738] px-[18px] py-[12px] rounded-[24px] font-bold text-base leading-[24px] text-[#241f0f] cursor-pointer transition-all duration-300 hover:bg-[#e6b730] max-w-max"
        aria-label="Unirse a la comunidad de WhatsApp de BackBone UTP (abre en una nueva pestaña)"
      >
        {{ ctaText }}
      </a>
    </div>
  </div>

  <!-- Right image section -->
  <div class="w-[438px] h-[356px] rounded-xl overflow-hidden shrink-0">
    <img
      [src]="imageUrl"
      alt="Backbone Community"
      class="w-full h-full object-cover"
    />
  </div>
</div>
