<main class="w-full flex flex-col items-center px-5 py-5 bg-dark">
  <!-- Hero Section -->
  <section class="w-full max-w-[960px]">
    <app-hero></app-hero>
  </section>

  <!-- Próximo Evento Section -->
  <section class="w-full max-w-[960px] mt-5">
    <div class="px-4 pb-3 pt-5">
      <h2 class="font-bold text-[22px] leading-[28px] text-white">
        Próximo Evento
      </h2>
    </div>
    <app-card-next-event [event]="nextEvent() ?? null"></app-card-next-event>
  </section>

  <!-- Eventos Previos Section -->
  <section class="w-full max-w-[960px] mt-5">
    <div class="px-4 pb-3 pt-5">
      <h2 class="font-bold text-[22px] leading-[28px] text-white">
        Eventos Previos
      </h2>
    </div>
    <div class="flex gap-3 p-4 overflow-x-auto">
      @for (event of pastEvents(); track event.title) {
        <app-previous-event-card [event]="event"></app-previous-event-card>
      }
    </div>
  </section>

  <!-- Proyectos Section -->
  <section class="w-full max-w-[960px] mt-5">
    <div class="px-4 pb-3 pt-5">
      <h2 class="font-bold text-[22px] leading-[28px] text-white">Proyectos</h2>
    </div>
    <div class="flex gap-3 p-4 overflow-x-auto">
      @for (project of projects(); track project.title) {
        <app-projects
          [title]="project.title"
          [description]="project.description"
          [imageUrl]="project.imageUrl"
          [status]="project.status"
          [link]="project.repoLink"
        ></app-projects>
      }
    </div>
  </section>

  <!-- Miembros Section -->
  <section class="w-full max-w-[960px] mt-5">
    <div class="px-4 pb-3 pt-5">
      <h2 class="font-bold text-[22px] leading-[28px] text-white">Miembros</h2>
    </div>
    <div class="flex flex-col gap-3 p-4">
      <!-- First row of members -->
      <div class="flex gap-3 flex-wrap">
        @for (member of members(); track member.name) {
          <app-member-card
            [name]="member.name"
            [role]="member.role"
            [photoUrl]="member.photoUrl"
          ></app-member-card>
        }
      </div>
    </div>
  </section>
  <app-footer></app-footer>
</main>
