<div class="w-[176px] flex flex-col gap-3 pb-3">
  <!-- Circular image -->
  <div class="flex justify-center px-4">
    <div class="w-full aspect-square rounded-full overflow-hidden">
      <img [src]="photoUrl" [alt]="name" class="w-full h-full object-cover" />
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-col items-center text-center">
    <h3 class="font-medium text-base leading-[24px] text-white">{{ name }}</h3>
    <p class="font-normal text-sm leading-[21px] text-[#ccbd8f]">
      {{ role }}
    </p>
  </div>
</div>
